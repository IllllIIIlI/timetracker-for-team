# Serves the whole LAN. Overrides timet.space to the Pi's own LAN IP (so
# devices at home avoid the NAT loopback problem when reaching the public
# domain) and forwards every other query upstream like a normal DNS server.
no-resolv
server=1.1.1.1
server=1.0.0.1

address=/timet.space/192.168.1.154
address=/www.timet.space/192.168.1.154
