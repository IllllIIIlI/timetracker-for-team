services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: timetracker
      POSTGRES_PASSWORD: timetracker
      POSTGRES_DB: timetracker
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://timetracker:timetracker@db:5432/timetracker?schema=public
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Terminates HTTPS and reverse-proxies both frontend and backend under one
  # origin. Set DOMAIN to a real public domain (e.g. timet.space) to get an
  # automatic Let's Encrypt certificate — this requires ports 80 and 443 to
  # be reachable from the internet (router port forward) and the domain's
  # DNS A record pointing at this machine's public IP. Left unset, it falls
  # back to "localhost" with Caddy's own locally-trusted certificate.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
      - backend

  # LAN DNS server: overrides timet.space to this machine's LAN IP for
  # devices on the home network (avoids the NAT loopback problem most
  # routers have reaching their own public IP from inside), and forwards
  # everything else upstream like a normal resolver. Only takes effect for
  # devices that use it as their DNS server — see deploy/README.md to point
  # your router's DHCP DNS setting at this machine.
  dns:
    image: 4km3/dnsmasq:2.90-r3
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro

volumes:
  db-data:
  caddy-data:
  caddy-config:
